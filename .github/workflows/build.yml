name: Build Flipper ESP32 Variants

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.board.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        board:
          - name: generic_esp32s3
            script_key: esp32s3
            build_dir: build_s3
            artifact_name: flipper-esp32s3-generic
            chip: esp32s3
            flash_size: 16MB
          - name: lilygo_t_embed_cc1101
            script_key: t_embed
            build_dir: build_t_embed
            artifact_name: flipper-lilygo-t-embed-cc1101
            chip: esp32s3
            flash_size: 16MB
          - name: waveshare_c6_1.9
            script_key: waveshare_c6
            build_dir: build_waveshare_c6
            artifact_name: flipper-waveshare-c6-1.9
            chip: esp32c6
            flash_size: 8MB

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Clean stale sdkconfig
        run: |
          rm -f sdkconfig
          rm -f ${{ matrix.board.build_dir }}/sdkconfig

      - name: Install ESP-IDF system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget flex bison gperf python3 python3-pip python3-venv \
            cmake ninja-build ccache libffi-dev libssl-dev dfu-util \
            libusb-1.0-0 libglib2.0-dev

      - name: Cache ESP-IDF
        uses: actions/cache@v6
        id: idf-cache
        with:
          path: ~/esp/esp-idf
          key: esp-idf-v5.4.1
          restore-keys: esp-idf-v5.4.1

      - name: Clone ESP-IDF v5.4.1
        if: steps.idf-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/esp
          git clone --branch v5.4.1 --depth 1 \
            https://github.com/espressif/esp-idf.git ~/esp/esp-idf

      - name: Cache ESP-IDF tools
        uses: actions/cache@v6
        id: idf-tools-cache
        with:
          path: ~/.espressif
          key: esp-idf-tools-v5.4.1

      - name: Install ESP-IDF tools
        if: steps.idf-tools-cache.outputs.cache-hit != 'true'
        run: |
          ~/esp/esp-idf/install.sh all

      - name: Verify ESP-IDF environment
        run: |
          source ~/esp/esp-idf/export.sh
          echo "IDF_PATH=$IDF_PATH"
          idf.py --version

      - name: Build
        run: |
          source ~/esp/esp-idf/export.sh
          bash ./build.sh --board ${{ matrix.board.script_key }} --build-only

      - name: Package artifacts
        run: |
          BOARD="${{ matrix.board.name }}"
          CHIP="${{ matrix.board.chip }}"
          FLASH_SIZE="${{ matrix.board.flash_size }}"
          BUILD="${{ matrix.board.build_dir }}"
          STAGE="artifact_staging"

          # Clean flat staging directory — what users actually unzip
          rm -rf "$STAGE"
          mkdir -p "$STAGE/bootloader" "$STAGE/partition_table"

          # Firmware binaries
          cp "$BUILD/furi_esp32.bin"                          "$STAGE/furi_esp32.bin"
          cp "$BUILD/bootloader/bootloader.bin"               "$STAGE/bootloader/bootloader.bin"
          cp "$BUILD/partition_table/partition-table.bin"     "$STAGE/partition_table/partition-table.bin"

          # ESP-IDF flash-args file (contains verified offsets and flash params)
          if [ -f "$BUILD/flash_project_args" ]; then
            cp "$BUILD/flash_project_args" "$STAGE/flash_args.txt"
          fi

          # ELF + map for decoding Guru panics with addr2line (not flashed,
          # just artifacts for post-mortem: xtensa-esp32s3-elf-addr2line -e
          # furi_esp32.elf -pfiaC <PC...>).
          cp "$BUILD/furi_esp32.elf" "$STAGE/" 2>/dev/null || true
          cp "$BUILD/furi_esp32.map" "$STAGE/" 2>/dev/null || true

          # --- merged single-file image for launchers (M5Launcher etc.) ---
          # Produces artifact_staging/merged-flash-<board>.bin that can be
          # flashed in one go at 0x0:  esptool write_flash 0x0 merged-*.bin
          # This is the file users asked for to "add to launcher".
          pip install -q esptool
          python tools/merge_flash_bin.py --build-dir "$BUILD" --chip "$CHIP" --flash-size "$FLASH_SIZE" \
            --output "$STAGE/merged-flash-${BOARD}.bin"
          ls -lh "$STAGE/merged-flash-${BOARD}.bin"
          # Also create the short launcher name some launchers expect
          cp "$STAGE/merged-flash-${BOARD}.bin" "$STAGE/merged-flash.bin"

          # Generate board-specific flash scripts by substituting template placeholders
          sed \
            -e "s/__BOARD_NAME__/${BOARD}/g" \
            -e "s/__CHIP__/${CHIP}/g"         \
            -e "s/__FLASH_SIZE__/${FLASH_SIZE}/g" \
            tools/flash_linux.sh > "$STAGE/flash_linux.sh"
          chmod +x "$STAGE/flash_linux.sh"

          sed \
            -e "s/__BOARD_NAME__/${BOARD}/g" \
            -e "s/__CHIP__/${CHIP}/g"         \
            -e "s/__FLASH_SIZE__/${FLASH_SIZE}/g" \
            tools/flash_windows.bat > "$STAGE/flash_windows.bat"

          echo ""
          echo "=== Staged artifact contents ==="
          ls -lh "$STAGE" "$STAGE/bootloader" "$STAGE/partition_table"

      # Queued external FAPs (see applications_user/FAP_QUEUE.md). T-Embed only:
      # buildFap.sh targets lilygo_t_embed_cc1101 and needs this job's firmware
      # build dir. continue-on-error so experimental FAPs never block the
      # firmware artifacts above — FAP results are reviewed from the job log.
      - name: Build queued FAPs (T-Embed only)
        if: matrix.board.script_key == 't_embed'
        continue-on-error: true
        run: |
          source ~/esp/esp-idf/export.sh
          mkdir -p artifact_staging/faps
          ./buildFap.sh applications_user/checkers
          cp build_t_embed/fap/*.fap artifact_staging/faps/ 2>/dev/null || echo "no .fap files produced"
          cp build_t_embed/fap/*.fal artifact_staging/faps/ 2>/dev/null || true
          ls -lh artifact_staging/faps/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.board.artifact_name }}
          # Upload from the flat staging dir so the zip has no extra path prefix.
          # Users unzip and immediately run flash_linux.sh or flash_windows.bat.
          path: artifact_staging/
          retention-days: 30
